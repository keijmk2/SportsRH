<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - SPORT RH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="icon" href="/SportsRH/Imagenes/Logo del proyecto en circulo.png">
    <link rel="stylesheet" href="./Torneos.css">
</head>

<body>
    <nav class="navbar d-flex justify-content-between align-items-center px-4">
        <a class="navbar-brand d-flex align-items-center gap-3" href="#">
            <img src="/SportsRH/Imagenes/Logo del proyecto en grande.png" alt="logo">
            <span>SPORT RH</span>
        </a>
        <a href="/SportsRH/Paginainiciada/PaginainiciadaPROFE.html" class="btn-regresar">
            ← Regresar
        </a>
    </nav>

    <div class="main py-5">

        <p class="page-title text-center">
            Calendario de partidos (Profesor)
        </p>
        <h1 class="page-subtitle text-center mb-4">
            Torneos 2026
        </h1>
        <div class="leyenda mb-5">

            <div class="leyenda-item">
                <div class="leyenda-dot"></div>
                Partido programado
            </div>
        </div>

        <div id="carouselMeses" class="carousel slide" data-bs-ride="false">

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselMeses" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselMeses" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

            <div class="carousel-inner" id="carouselContainer">
            </div>

        </div>
    </div>

    <footer class="pie">

        <p>© SPORT RH 2026</p>

        <p>
            Cra. 50B #97a-30, Santa Cruz, Medellín, Antioquia
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SCRIPT PARA GENERAR LOS MESES -->
    <script>
        const year = 2026;
        const meses = [
            "Enero", "Febrero", "Marzo", "Abril",
            "Mayo", "Junio", "Julio", "Agosto",
            "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];
        const diasSemana = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
        const carousel = document.getElementById("carouselContainer");
        for (let mes = 0; mes < 12; mes++) {
            let primerDia = new Date(year, mes, 1);
            let inicio = primerDia.getDay();
            inicio = inicio === 0 ? 6 : inicio - 1;
            let diasMes = new Date(year, mes + 1, 0).getDate();
            let html = `
    <div class="carousel-item ${mes === 0 ? "active" : ""}">
        <div class="mes-bloque">
            <div class="mes-titulo">
                ${meses[mes]} ${year}
            </div>
            <table class="cal-table">
                <thead>
                    <tr>
                        ${diasSemana.map(d => `<th>${d}</th>`).join("")}
                    </tr>
                </thead>
                <tbody>
    `;
            let dia = 1;
            while (dia <= diasMes) {
                html += "<tr>";
                for (let i = 0; i < 7; i++) {
                    if ((dia === 1 && i < inicio) || dia > diasMes) {
                        html += "<td></td>";
                    } else {
                        html += `
                <td>
                    <div class="day-num cur">${dia}</div>
                </td>
                `;
                        dia++;
                    }
                }
                html += "</tr>";
            }
            html += `
                </tbody>
            </table>
        </div>
    </div>
    `;
            carousel.innerHTML += html;
        }
    </script>
</body>

</html>
