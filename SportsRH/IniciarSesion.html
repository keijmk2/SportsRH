<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="./paginainiciada.css">

    <title>INICIAR SESION</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <a class="navbar-brand d-flex align-items-center">
                    <img src="Logo del proyecto en grande.png" alt="logo" width="60">
                    <span class="ms-2">SportsRH</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContenido">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarContenido">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/SportsRH/Acerca de nosotros.html">Acerca de nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/SportsRH/SportsRH.html">Inicio</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <div class="titulo">
        <h1>Iniciar sesión</h1>
    </div>

    <form> 
        <fieldset>
            <div class="formulario">
                <label for="nom">Cargo:</label>
                <select name="nom" id="nom">
                    <option>Seleccione una opción</option>
                    <option>Estudiante</option>
                    <option>Profesor</option>
                    <option>Administrador</option>
                </select>

                <br><br>

                <label for="correo">Correo IE:</label>
                <input type="email" placeholder="Email..." name="correo" id="correo">

                <br><br>

                <label for="con">Contraseña:</label>
                <input type="password" placeholder="Contraseña..." name="con" id="con">

                <br><br>

                <button type="button" class="btn btn-success">Iniciar Sesion</button>
                <button type="button" class="btn btn-danger">Olvide mi contraseña</button>
            </div>
        </fieldset>

        <br>

        <footer>
            <h6>© SPORT RH 2026</h6>
        </footer>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>

</body>
</html>
