<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>INICIAR SESION</title>
</head>

<body style="background-color: #1a1a1a;">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" >
            <div class="container-fluid">
                <a class="navbar-brand" href="#">SportRH</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div style="text-align: center; color: #4b946f; ;">
        <H1>Iniciar sesión</H1>
    </div>
    <form> 
        <fieldset>
            <div style="text-align: center; color: #4b946f;">
                <label for="nom">Cargo:</label>
                <select name="nom" id="nom">
                    <option>Seleccione una opción</option>
                    <option>Estudiante</option>
                    <option>Profesor</option>
                    <option>Administrador</option>
                </select>
                <br><br>
                <label for="correo">Correo IE:</label>
                <input type="email" placeholder="Email..." name="correo" id="correo">
                <br><br>
                <label for="con">Contraseña:</label>
                <input type="password" placeholder="Contraseña..." name="con" id="con">
                <br><br>
                <button type="button" class="btn btn-success">Iniciar Sesion</button>
                <button type="button" class="btn btn-danger">Olvide mi contraseña</button>
            </div>
        </fieldset>
<br>
        <footer style="background-color: #588157;">
            <h6>© SPORT RH 2026</h6>
        </footer>
        <style>
            footer {
                text-align: center;
                padding: 15px;
                background: #f2f2f2;
            }

            footer a {
                text-decoration: none;
                margin: 0 5px;
            }
        </style>
    </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

</html>
