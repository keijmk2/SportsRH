<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos - SPORT RH</title>
    <link rel="stylesheet" href="./Prestamos.css">
    <link rel="icon" href="/SportsRH/Imagenes/Logo del proyecto en circulo.png">
</head>

<body>

    <header class="cabeza">
        <div class="logo-titulo">
            <img src="/SportsRH/Imagenes/Logo del proyecto en grande.png" alt="Logo">
            <h1>SPORT RH</h1>
        </div>
        <nav>
            <a href="/SportsRH/Paginainiciada/PaginainiciadaPROFE.html">INICIO</a>
            <a href="/SportsRH/Contactanos/ContactanosPROFE.html">CONTACTANOS</a>
            <a href="/SportsRH/Tuperfil/TuperfilPROFES.html">PERFIL</a>
        </nav>
    </header>

    <main>
        <section class="contenedor-formulario">
            <h2>Solicitud de Préstamos</h2>
            <p class="descripcion">
                Complete el siguiente formulario para solicitar el préstamo de implementos deportivos.
                La solicitud será revisada por el administrador del sistema antes de su aprobación.
            </p>
            <form>
                <div class="grupo">
                    <label>Nombre completo</label>
                    <input type="text" required>
                </div>
                <div class="grupo">
                    <label>ID de Usuario</label>
                    <input type="text" required>
                </div>
                <div class="grupo">
                    <label>Cargo</label>
                    <select required>
                        <option value="">Seleccione</option>
                        <option>Administrador</option>
                        <option>Docente</option>
                        <option>Estudiante</option>
                    </select>
                </div>
                <div class="grupo">
                    <label>Implemento solicitado</label>
                    <select required>
                        <option value="">Seleccione</option>
                        <option>Balón de Fútbol</option>
                        <option>Balón de Baloncesto</option>
                        <option>Balón de Voleibol</option>
                        <option>Aros</option>
                        <option>Colchonetas</option>
                        <option>Bastones</option>
                    </select>
                </div>
                <div class="grupo">
                    <label>Cantidad solicitada</label>
                    <input type="number" min="1" required>
                </div>
                <div class="grupo">
                    <label>Fecha de préstamo</label>
                    <input type="date" required>
                </div>

                <div class="grupo">
                    <label>Fecha de devolución</label>
                    <input type="date" required>
                </div>
                <div class="grupo">
                    <label>Motivo de la solicitud</label>
                    <textarea rows="6" required></textarea>
                </div>
                <div class="grupo-check">
                    <input type="checkbox" required>
                    <label>
                        Me comprometo a cuidar y devolver los implementos en las mismas condiciones en las que fueron entregados.
                    </label>
                </div>
                <button type="submit" class="btn-enviar">
                    Enviar Solicitud
                </button>
            </form>
        </section>

    </main>

    <footer>
        <h6>© SPORT RH 2026</h6>
        <h6>
            Cra. 50B #97a-30,
            Santa Cruz, Medellín,
            Antioquia
        </h6>
    </footer>

</body>

</html>
