<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./IniciarSesion.css">

    <link rel="icon" href="/SportsRH/Imagenes/Logo del proyecto en circulo.png">

    <title>INICIAR SESION</title>

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center">
                    <img src="/SportsRH/Imagenes/Logo del proyecto en grande.png" alt="logo" width="60">
                    <span class="ms-2">
                        SportsRH
                    </span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContenido">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarContenido">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/SportsRH/Contactanos/Contactanos.html">
                                CONTACTANOS
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/SportsRH/Acercadenosotros/Acercadenosotros.html">
                                ACERCA DE NOSOTROS
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/SportsRH/Index.html">
                                INICIO
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- TITULO -->
    <div class="titulo text-center mt-4">
        <h1>
            Iniciar sesión
        </h1>
    </div>
    <!-- FORMULARIO -->
    <form id="IniciarSesion">
        <fieldset>
            <div class="formulario container mt-4">
                <label for="nom" class="form-label">
                    Cargo:
                </label>
                <select name="nom" id="nom" class="form-select mb-3">
                    <option value="">
                        Seleccione una opción
                    </option>
                    <option value="estudiante">
                        Estudiante
                    </option>
                    <option value="profesor">
                        Profesor
                    </option>
                    <option value="administrador">
                        Administrador
                    </option>
                </select>
                <label for="correo" class="form-label">
                    Correo IE:
                </label>
                <input type="email" placeholder="Email..." name="correo" id="correo" class="form-control mb-3">
                <label for="con" class="form-label">
                    Contraseña:
                </label>
                <!--BOTONES-->
                <input type="password" placeholder="Contraseña..." name="con" id="con" class="form-control mb-4">
                <button type="submit" class="btn btn-outline-success w-100 mb-3">
                    Iniciar Sesión
                </button>
                <button type="button" class="btn btn-outline-warning w-100"
                    onclick="window.location.href='/SportsRH/IniciarSesion/OlvidoContraseña.html'">
                    Olvidó su Contraseña
                </button>
            </div>
        </fieldset>
    </form>

    <footer class="text-center mt-5">
        <h6>
            © SPORT RH 2026
        </h6>
        <h6>
            Cra. 50B #97a-30, Santa Cruz, Medellín,
            Antioquia
        </h6>
    </footer>

    <script src="/SportsRH/js/IniciarSesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
