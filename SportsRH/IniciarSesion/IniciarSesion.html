<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./IniciarSesion.css">

    <link rel="icon" href="/SportsRH/Imagenes/Logo del proyecto en circulo.png">

    <title>INICIAR SESIÓN</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <a class="navbar-brand d-flex align-items-center">
                    <img src="/SportsRH/Imagenes/Logo del proyecto en grande.png" alt="logo" width="60">
                    <span class="ms-2">SportsRH</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContenido">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarContenido">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link text-white"
                                href="/SportsRH/Contactanos/Contactanos.html">
                                CONTACTANOS
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white"
                                href="/SportsRH/Acercadenosotros/Acercadenosotros.html">
                                ACERCA DE NOSOTROS
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="/Index.html">
                                INICIO
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <div class="titulo">
        <h1>Iniciar sesión</h1>
    </div>

    <form id="IniciarSesion">

        <fieldset>

            <div class="formulario">

                <label for="nom">Cargo:</label>

                <select name="nom" id="nom">

                    <option value="">Seleccione una opción</option>

                    <option value="estudiante">
                        Estudiante
                    </option>

                    <option value="profesor">
                        Profesor
                    </option>

                    <option value="administrador">
                        Administrador
                    </option>

                </select>

                <label for="email">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    placeholder="Email..."
                    name="email"
                    id="email"
                >

                <label for="password">
                    Contraseña:
                </label>

                <input
                    type="password"
                    placeholder="Contraseña..."
                    name="password"
                    id="password"
                >

                <button
                    type="submit"
                    class="btn btn-outline-success"
                >
                    Iniciar Sesión
                </button>

                <button
                    type="button"
                    class="btn btn-outline-warning"
                >
                    Olvidé mi contraseña
                </button>

            </div>

        </fieldset>

        <br>

    </form>

    <footer>
        <h6>© SPORT RH 2026</h6>
        <h6>Cra. 50B #97a-30, Santa Cruz, Medellín, Antioquia</h6>
    </footer>

    <script src="../js/IniciarSesion.js"></script>
    <script>

    let usuario =
        localStorage.getItem("usuario");

    if (usuario !== "administrador") {

        alert("No tienes permisos");

        window.location.href =
            "/Index.html";
    }

</script>


</body>

</html>
