<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./OlvidoContraseña.css">
    <link rel="icon" href="/SportsRH/Imagenes/Logo del proyecto en circulo.png">
    <title>OLVIDÓ SU CONTRASEÑA</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <a class="navbar-brand d-flex align-items-center">
                    <img src="/SportsRH/Imagenes/Logo del proyecto en grande.png" alt="logo" width="60">
                    <span class="ms-2">SportsRH</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContenido">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarContenido">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link text-white"
                                href="/SportsRH/Contactanos/Contactanos.html">CONTACTANOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white"
                                href="/SportsRH/Acercadenosotros/Acercadenosotros.html">
                                ACERCA DE NOSOTROS
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/SportsRH/Index.html">INICIO</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <div class="titulo">
        <h1>Olvidó su contraseña</h1>
    </div>

    <form>
        <fieldset>
            <div class="formulario">

                <label for="correo">Correo IE:</label>
                <input type="email" placeholder="Email..." name="correo" id="correo">

                <label for="nuevaCon">Nueva contraseña:</label>
                <input type="password" placeholder="Nueva contraseña..." name="nuevaCon" id="nuevaCon">

                <label for="confirmarCon">Confirma la contraseña:</label>
                <input type="password" placeholder="Confirmar contraseña..." name="confirmarCon"
                    id="confirmarCon">

                <button type="button" class="btn btn-outline-success"
                    onclick="window.location.href='/SportsRH/IniciarSesion/IniciarSesion.html'">
                    Guardar cambios
                </button>

            </div>
        </fieldset>

        <br>
    </form>

    <footer>
        <h6>© SPORT RH 2026</h6>
    </footer>

</body>

</html>
