<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./OlvidoContraseña.css">
    <link rel="icon" href="/SportsRH/Imagenes/Logo del proyecto en circulo.png">
    <title>OLVIDÓ SU CONTRASEÑA</title>
</head>

<body>

    <body>
        <header>
            <nav class="navbar d-flex justify-content-between align-items-center px-4">
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="/SportsRH/Imagenes/Logo del proyecto en grande.png" alt="logo" width="60">
                    <span>SPORT RH</span>
                </a>
                <a href="./IniciarSesion.html" class="btn-regresar">
                    ← Regresar
                </a>
            </nav>
        </header>
        <main class="contenido">
            <div class="titulo">
                <h1>OLVIDÓ SU CONTRASEÑA</h1>
            </div>
            <form id="formRecuperacion">
                <fieldset>
                    <div class="formulario">
                        <label for="correo">Correo:</label>
                        <input type="email" placeholder="Email..." name="correo" id="correo">

                        <label for="nuevaCon">Nueva contraseña:</label>
                        <input type="password" placeholder="Nueva contraseña..." name="nuevaCon" id="nuevaCon">

                        <label for="confirmarCon">Confirma la contraseña:</label>
                        <input type="password" placeholder="Confirmar contraseña..." name="confirmarCon"
                            id="confirmarCon">

                        <button type="button" class="btn btn-outline-success" id="guardarCambios">
                            Guardar cambios
                        </button>
                        <div id="mensaje" class="mensaje"></div>
                    </div>
                </fieldset>
            </form>
        </main>

        <footer>
            <h6>© SPORT RH 2026</h6>
            <h6>
                Cra. 50B #97a-30, Santa Cruz, Medellín, Antioquia
            </h6>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/OlvidoContraseña.js"></script>
    </body>
</body>

</html>
